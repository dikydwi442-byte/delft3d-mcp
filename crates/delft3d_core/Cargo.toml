[package]
name = "delft3d_core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "delft3d_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
byteorder = "1.5"
memmap2 = "0.9"
pyo3 = { version = "0.23", features = ["auto-initialize"] }
rayon = "1.10"
thiserror = "2.0"

[features]
extension-module = ["pyo3/extension-module"]

[lints]
workspace = true
