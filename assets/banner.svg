<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1996cb"/>
      <stop offset="55%" stop-color="#0d7fab"/>
      <stop offset="100%" stop-color="#086993"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7f8fa"/>
      <stop offset="100%" stop-color="#d8dde3"/>
    </linearGradient>
    <filter id="outerShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Outer rounded frame -->
  <rect x="16" y="16" width="224" height="224" rx="26" fill="url(#frameGrad)" filter="url(#outerShadow)"/>

  <!-- Inner blue gradient tile -->
  <rect x="28" y="28" width="200" height="200" rx="18" fill="url(#tileGrad)"/>

  <!-- Pentagon and radial network lines -->
  <g stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer pentagon -->
    <polygon points="128,64 196,113 170,192 86,192 60,113"/>
    <!-- Spokes from center to pentagon vertices -->
    <line x1="128" y1="135" x2="128" y2="64"/>
    <line x1="128" y1="135" x2="196" y2="113"/>
    <line x1="128" y1="135" x2="170" y2="192"/>
    <line x1="128" y1="135" x2="86" y2="192"/>
    <line x1="128" y1="135" x2="60" y2="113"/>
  </g>

  <!-- White nodes -->
  <g fill="#ffffff">
    <circle cx="128" cy="135" r="19"/>
    <circle cx="128" cy="64" r="18"/>
    <circle cx="196" cy="113" r="18"/>
    <circle cx="170" cy="192" r="18"/>
    <circle cx="86" cy="192" r="18"/>
    <circle cx="60" cy="113" r="18"/>
  </g>
</svg>
